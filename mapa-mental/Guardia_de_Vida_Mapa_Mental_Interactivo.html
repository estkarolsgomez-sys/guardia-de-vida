<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Guardia de Vida · Mapa mental interactivo</title>
<style>
:root{
  --glass:rgba(15,18,25,.78);
  --line:rgba(255,255,255,.14);
  --text:#fff;
  --muted:#aeb7c6;
  --accent:#4bb8ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;touch-action:none}
button,input{font:inherit}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:0}
#handCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:11000;pointer-events:none}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.22),transparent 22%,transparent 72%,rgba(0,0,0,.28))}
#interface{position:fixed;inset:0;z-index:10;pointer-events:none}
#topBar{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:7px;border:1px solid var(--line);border-radius:22px;background:rgba(12,15,21,.62);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);pointer-events:auto;max-width:calc(100vw - 24px);overflow:auto}
.uiButton{border:0;border-radius:14px;padding:10px 13px;color:#fff;background:rgba(255,255,255,.09);white-space:nowrap;cursor:pointer}.uiButton:active{transform:scale(.97)}
#status{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 58px);left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:16px;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(14px);font-size:12px;white-space:nowrap;pointer-events:none}
#cameraStatus{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:15px;color:#fff;background:rgba(0,0,0,.38);font-size:11px;pointer-events:none}.cameraDot{width:8px;height:8px;border-radius:50%;background:#ffae00}.cameraDot.ready{background:#32df67;box-shadow:0 0 12px #32df67}
#cursor{position:absolute;z-index:11100;width:34px;height:34px;border:2px solid rgba(255,255,255,.95);border-radius:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .12s,transform .08s,border-color .1s;box-shadow:0 0 28px rgba(80,180,255,.72);pointer-events:none}#cursor.active{opacity:1}#cursor.dwelling{border-color:var(--accent);transform:translate(-50%,-50%) scale(.78)}#cursor::after{content:"";position:absolute;inset:4px;border-radius:50%;background:conic-gradient(var(--accent) var(--progress,0deg),transparent 0);opacity:.85}
#menu{position:absolute;left:50%;top:50%;width:330px;height:330px;transform:translate(-50%,-50%) scale(.72);opacity:0;pointer-events:none;transition:.18s ease}#menu.visible{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}.menuCenter{position:absolute;left:50%;top:50%;width:92px;height:92px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;color:white;background:radial-gradient(circle,rgba(72,151,255,.34),rgba(15,20,30,.92));backdrop-filter:blur(28px)}.menuItem{position:absolute;width:86px;height:86px;border:1px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#fff;background:rgba(15,20,28,.82);backdrop-filter:blur(22px);cursor:pointer}.menuItem:hover,.menuItem.hovered{background:rgba(60,150,255,.4);border-color:rgba(100,190,255,.7);transform:scale(1.06)}.menuItem .icon{font-size:25px}.menuItem .name{font-size:10px}.menuItem:nth-child(2){left:122px;top:0}.menuItem:nth-child(3){right:0;top:122px}.menuItem:nth-child(4){left:122px;bottom:0}.menuItem:nth-child(5){left:0;top:122px}
.spatialWindow{position:absolute;width:min(520px,86vw);height:min(390px,62vh);transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--glass);box-shadow:0 32px 90px rgba(0,0,0,.5);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);pointer-events:auto;user-select:none;touch-action:none}.spatialWindow.anchored .pin{box-shadow:0 0 10px rgba(40,200,120,.75)}.spatialWindow.selected{border-color:rgba(70,185,255,.92);box-shadow:0 0 42px rgba(40,160,255,.22),0 32px 90px rgba(0,0,0,.55)}.windowHeader{height:44px;display:flex;align-items:center;gap:9px;padding:0 11px;color:#fff;background:rgba(255,255,255,.055);border-bottom:1px solid rgba(255,255,255,.1);cursor:grab;touch-action:none}.windowDot{width:12px;height:12px;border-radius:50%;flex:none;cursor:pointer}.close{background:#ff5f57}.minimize{background:#febc2e}.pin{background:#28c840}.windowTitle{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}.windowActions{display:flex;gap:6px}.miniBtn{border:0;border-radius:9px;padding:6px 8px;color:#fff;background:rgba(255,255,255,.08);cursor:pointer;font-size:11px}.windowBody{width:100%;height:calc(100% - 44px);background:#fff;position:relative}.windowBody.minimized{display:none}.browserShell{display:flex;flex-direction:column;width:100%;height:100%;background:#eef1f5}.browserBar{display:flex;gap:6px;padding:7px;background:#181c24;border-bottom:1px solid rgba(255,255,255,.12);flex:none}.browserBar input{flex:1;min-width:0;border:0;outline:0;border-radius:11px;padding:9px 11px;background:#fff;color:#111;font-size:14px}.browserBar button{border:0;border-radius:10px;padding:0 10px;background:#2c86ff;color:#fff}.frameWrap{flex:1;min-height:0;position:relative;background:#fff}.frameWrap iframe{width:100%;height:100%;border:0;background:#fff}.iframeShield{display:none;position:absolute;inset:0;z-index:5}.spatialWindow.dragging .iframeShield{display:block}
.notesArea{width:100%;height:100%;border:0;outline:0;padding:16px;resize:none;font-size:16px;line-height:1.45;color:#16181c}
#help{position:absolute;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:94%;padding:9px 14px;border:1px solid rgba(255,255,255,.1);border-radius:18px;color:#ddd;background:rgba(0,0,0,.43);backdrop-filter:blur(14px);font-size:12px;text-align:center;pointer-events:none}
#keyboard{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10000;width:min(760px,96vw);padding:10px;border:1px solid var(--line);border-radius:20px;background:rgba(12,15,21,.94);backdrop-filter:blur(24px);display:none;pointer-events:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}#keyboard.visible{display:block}.keyboardTop{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;color:#fff;font-size:12px}.keyboardRows{display:flex;flex-direction:column;gap:6px}.keyRow{display:flex;justify-content:center;gap:5px}.key{min-width:34px;height:42px;flex:1;border:0;border-radius:10px;color:#fff;background:rgba(255,255,255,.11);font-size:16px}.key.wide{flex:1.6}.key.space{flex:5}.key:active{background:rgba(75,184,255,.45)}
#startScreen{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:30px;color:#fff;text-align:center;background:radial-gradient(circle at center,#202733 0%,#090b0f 50%,#000 100%)}#startScreen h1{font-size:clamp(38px,9vw,76px);letter-spacing:-3px}#startScreen p{max-width:650px;color:#aeb5c2;line-height:1.55}#startButton{border:0;padding:15px 28px;border-radius:20px;background:#fff;color:#000;font-size:16px;font-weight:700}
@media(max-width:600px){#cameraStatus{display:none}.spatialWindow{width:92vw;height:58vh;border-radius:20px}.windowHeader{height:42px}.windowBody{height:calc(100% - 42px)}#menu{width:290px;height:290px}.menuItem{width:76px;height:76px}.menuItem:nth-child(2){left:107px}.menuItem:nth-child(3){top:107px}.menuItem:nth-child(4){left:107px}.menuItem:nth-child(5){top:107px}#help{font-size:10px}.uiButton{padding:9px 10px;font-size:12px}.browserBar input{font-size:16px}}
@media(orientation:landscape) and (max-height:560px){#help{display:none}.spatialWindow{height:72vh}#keyboard{width:min(900px,98vw);bottom:4px}.key{height:34px}}
 .topicBody{height:100%;overflow:auto;background:#f0f8fb;color:#172c39;touch-action:pan-y}.topicBody img{width:100%;height:43%;object-fit:cover;display:block}.topicText{padding:15px 20px 22px;font-size:14px;line-height:1.55}.topicText h2{font-size:20px;margin-bottom:8px;color:#075c64}.topicText p{margin-bottom:12px}.topicText ol{padding-left:22px}.topicText li{margin:7px 0}.missingPhoto{padding:15px;background:#fff1d5;color:#734400}.menuCenter{font-size:12px;font-weight:800;text-align:center;padding:12px}.spatialWindow{height:min(490px,72vh)}@media(max-width:600px){.spatialWindow{height:70vh}.topicBody img{height:36%}}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video><div id="shade"></div><canvas id="handCanvas"></canvas>
<div id="interface">
  <div id="topBar">
    <button class="uiButton" id="menuButton">＋ Temas</button>
    <button class="uiButton" id="keyboardButton">⌨ Notas</button>
    <button class="uiButton" id="centerButton">⊙ Centrar</button>
    <button class="uiButton" id="clearButton">Cerrar todo</button>
  </div>
  <div id="cameraStatus"><span class="cameraDot" id="cameraDot"></span><span id="cameraText">Cámara</span></div>
  <div id="status">Esperando índice...</div>
  <div id="cursor"></div>
  <div id="menu">
    <div class="menuCenter">GUARDIA DE VIDA</div>
    <button class="menuItem" data-type="inicio"><span class="icon">🏥</span><span class="name">Inicio</span></button>
    <button class="menuItem" data-type="hospital"><span class="icon">🏨</span><span class="name">Hospital</span></button>
    <button class="menuItem" data-type="bandeja"><span class="icon">🩺</span><span class="name">Bandeja</span></button>
    <button class="menuItem" data-type="paciente"><span class="icon">👩‍⚕️</span><span class="name">Paciente</span></button>
  </div>
  <div id="help">☝ Señala un tema y 🤏 pellizca para abrir · También puedes tocar o hacer clic</div>
</div>
<div id="keyboard" aria-label="Teclado virtual">
  <div class="keyboardTop"><span>Teclado virtual</span><button class="miniBtn" id="hideKeyboard">Cerrar</button></div>
  <div class="keyboardRows" id="keyboardRows"></div>
</div>
<div id="startScreen"><h1>Guardia de Vida · Mapa mental</h1><p>Explora las imágenes reales de tu juego y abre ventanas informativas señalando con la mano o tocando la pantalla.</p><button id="startButton">Comenzar mapa mental</button></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const $=s=>document.querySelector(s);
const camera=$('#camera'),cursor=$('#cursor'),menu=$('#menu'),statusText=$('#status'),cameraDot=$('#cameraDot'),cameraText=$('#cameraText');
const startScreen=$('#startScreen'),startButton=$('#startButton'),keyboard=$('#keyboard'),keyboardRows=$('#keyboardRows');
const STORAGE_KEY='guardia-vida-mapa-v1';
const DWELL_MS=700;
const MOVE_SMOOTH=0.24;
const PINCH_ON=0.055;
const PINCH_OFF=0.078;
const HIT_HYSTERESIS=14;
let windows=[],selectedWindow=null,nextWindowId=1,menuOpen=false;
let smoothX=innerWidth/2,smoothY=innerHeight/2;
let hoverTarget=null,hoverStarted=0,lastClickAt=0;
let activeFacing='user';
let activeInput=null;
let pointerDrag=null;
let pinchActive=false,pinchTarget=null;

const APP_TYPES={
 inicio:{title:'Inicio del juego',url:''},
 hospital:{title:'El hospital',url:''},
 bandeja:{title:'Bandeja de instrumentos',url:''},
 paciente:{title:'Atención al paciente',url:''},
 interaccion:{title:'Interacción y gatillo',url:''}
};
const TOPICS={
 inicio:{image:'inicio.jpg',heading:'Comienza tu misión',description:'Guardia de Vida es una simulación educativa en un hospital virtual. Observa la habitación, reconoce el equipo médico y completa las cinco exploraciones indicadas en el juego.',steps:['Inicia el simulador y observa el entorno.','Identifica la bandeja y la camilla del paciente.','Dirígete hacia el instrumento que necesitas.']},
 hospital:{image:'hospital.jpg',heading:'Conoce el hospital virtual',description:'El escenario incluye la habitación Q01, una camilla, personal sanitario, monitores y una bandeja de instrumentos. La misión es explorar a la paciente en este entorno de simulación.',steps:['Mira alrededor usando los controles del juego.','Ubica a la paciente y los instrumentos.','Desplázate con pasos controlados; puedes regresar hacia la bandeja.']},
 bandeja:{image:'bandeja.jpg',heading:'Instrumentos médicos',description:'En la bandeja puedes identificar instrumentos para auscultación, temperatura, revisión ocular, vendaje y práctica. Cada herramienta corresponde a una actividad educativa.',steps:['Apunta con la cruz central al instrumento.','Presiona el gatillo una vez para recogerlo.','Transporta el objeto hacia la paciente.']},
 interaccion:{image:'interaccion.jpg',heading:'Cómo usar el gatillo',description:'El gatillo es el control principal para recoger y utilizar instrumentos en el juego. La cruz del visor indica a qué objeto estás apuntando.',steps:['Coloca la cruz sobre el instrumento.','Presiona el gatillo para cargarlo.','Acércate al paciente y apunta a la zona indicada.','Presiona el gatillo otra vez para aplicar o dejar el instrumento.']},
 paciente:{image:'paciente.jpg',heading:'Exploraciones de la paciente',description:'La ficha clínica de simulación muestra los indicadores del paciente y el progreso de cinco exploraciones. Son datos ficticios de entrenamiento, no mediciones reales.',steps:['Selecciona el instrumento adecuado.','Acércate a la camilla y apunta al paciente.','Usa el gatillo para completar la acción.','Consulta el contador de exploraciones realizadas.']}
};

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function safeUrl(value){
 const raw=(value||'').trim(); if(!raw) return 'https://www.google.com/search?igu=1&q=';
 if(/^https?:\/\//i.test(raw)) return raw;
 if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(raw)) return 'https://'+raw;
 return 'https://www.google.com/search?igu=1&q='+encodeURIComponent(raw);
}
function youtubeEmbed(value){
 const raw=(value||'').trim();
 const m=raw.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/i);
 if(m) return 'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&playsinline=1';
 return 'https://www.youtube.com/results?search_query='+encodeURIComponent(raw||'');
}
function titleForUrl(url,type){try{const u=new URL(url);return type==='youtube'?'YouTube · '+u.hostname:u.hostname.replace(/^www\./,'')}catch{return APP_TYPES[type]?.title||'Ventana'}}

function saveWindows(){
 const vw=Math.max(1,innerWidth),vh=Math.max(1,innerHeight);
 const data=windows.map(w=>({type:w.type,nx:w.nx,ny:w.ny,x:w.x/vw,y:w.y/vh,scale:w.scale,minimized:w.minimized,url:w.url||'',title:w.title||'',anchored:!!w.anchored,notes:''}));
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){console.warn(e)}
}
function loadWindows(){
 try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(!Array.isArray(saved))return;saved.slice(0,10).forEach(i=>{const nx=Number.isFinite(+i.nx)?+i.nx:(+i.x||.5);const ny=Number.isFinite(+i.ny)?+i.ny:(+i.y||.5);createWindow(i.type,clamp(nx*innerWidth,45,innerWidth-45),clamp(ny*innerHeight,45,innerHeight-45),i.scale||1,true,{...i,nx,ny})});}catch(e){console.warn(e)}
}
function buildBrowserBody(object,type,url){
 const info=TOPICS[type]; const shell=document.createElement('div');shell.className='topicBody';
 const photo=document.createElement('img');photo.src=info.image;photo.alt='Captura del juego: '+info.heading;photo.loading='lazy';
 photo.onerror=()=>{photo.style.display='none';const notice=document.createElement('p');notice.className='missingPhoto';notice.textContent='No se encontró '+info.image+'. Sube esta imagen a la misma carpeta mapa-mental.';shell.prepend(notice)};
 const content=document.createElement('div');content.className='topicText';
 const heading=document.createElement('h2');heading.textContent=info.heading;
 const description=document.createElement('p');description.textContent=info.description;
 const list=document.createElement('ol');info.steps.forEach(t=>{const li=document.createElement('li');li.textContent=t;list.appendChild(li)});
 content.append(heading,description,list);shell.append(photo,content);return shell;
}

function createWindow(type,x=innerWidth/2,y=innerHeight/2,scale=1,restoring=false,saved={}){
 if(!APP_TYPES[type]||(!restoring&&windows.length>=10)){statusText.textContent='Máximo de 10 ventanas';return null}
 const element=document.createElement('section');element.className='spatialWindow'+(saved.anchored!==false?' anchored':'');element.dataset.id=nextWindowId;
 const object={id:nextWindowId++,type,element,x,y,targetX:x,targetY:y,nx:Number.isFinite(+saved.nx)?+saved.nx:x/innerWidth,ny:Number.isFinite(+saved.ny)?+saved.ny:y/innerHeight,scale,minimized:!!saved.minimized,url:saved.url||APP_TYPES[type].url,title:saved.title||APP_TYPES[type].title,anchored:saved.anchored!==false};
 element.innerHTML=`<div class="windowHeader"><span class="windowDot close" title="Cerrar"></span><span class="windowDot minimize" title="Minimizar"></span><span class="windowDot pin" title="Fija"></span><span class="windowTitle">${esc(object.title)}</span><div class="windowActions"><button class="miniBtn keyboardLocal">⌨</button></div></div><div class="windowBody"></div>`;
 $('#interface').appendChild(element);windows.push(object);updateWindow(object);
 const body=element.querySelector('.windowBody'); if(object.minimized)body.classList.add('minimized');
 if(false){
   const ta=document.createElement('textarea');ta.className='notesArea';ta.placeholder='Escribe tus notas…';ta.value=saved.notes||'';ta.addEventListener('focus',()=>activeInput=ta);ta.addEventListener('input',saveWindows);ta.addEventListener('pointerdown',e=>e.stopPropagation());body.appendChild(ta);
 } else body.appendChild(buildBrowserBody(object,type,object.url));
 element.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();removeWindow(object)});
 element.querySelector('.minimize').addEventListener('click',e=>{e.stopPropagation();object.minimized=!object.minimized;body.classList.toggle('minimized',object.minimized);saveWindows()});
 element.querySelector('.pin').addEventListener('click',e=>{e.stopPropagation();object.anchored=!object.anchored;object.element.classList.toggle('anchored',object.anchored);object.element.querySelector('.pin').title=object.anchored?'Anclada en el entorno':'Posición guardada';saveWindows()});
 element.querySelector('.keyboardLocal').addEventListener('click',e=>{e.stopPropagation();createWindow('interaccion',innerWidth*.54,innerHeight*.48)});
 element.addEventListener('pointerdown',e=>selectWindow(object));
 const header=element.querySelector('.windowHeader');header.addEventListener('pointerdown',e=>{
   if(e.target.closest('.windowDot,.miniBtn'))return;e.preventDefault();selectWindow(object);header.setPointerCapture?.(e.pointerId);pointerDrag={w:object,dx:e.clientX-object.x,dy:e.clientY-object.y,id:e.pointerId};element.classList.add('dragging');
 });
 header.addEventListener('pointermove',e=>{if(!pointerDrag||pointerDrag.id!==e.pointerId)return;object.x=object.targetX=clamp(e.clientX-pointerDrag.dx,45,innerWidth-45);object.y=object.targetY=clamp(e.clientY-pointerDrag.dy,45,innerHeight-45);object.nx=object.x/innerWidth;object.ny=object.y/innerHeight;updateWindow(object)});
 const end=e=>{if(pointerDrag&&pointerDrag.id===e.pointerId){element.classList.remove('dragging');pointerDrag=null;saveWindows()}};header.addEventListener('pointerup',end);header.addEventListener('pointercancel',end);
 selectWindow(object);saveWindows();return object;
}
function removeWindow(w){if(!w)return;w.element.remove();windows=windows.filter(x=>x!==w);if(selectedWindow===w)selectedWindow=null;saveWindows()}
function selectWindow(w){if(!w)return;windows.forEach(x=>{x.element.classList.remove('selected');x.element.style.zIndex='100'});w.element.classList.add('selected');w.element.style.zIndex='5000';selectedWindow=w}
function updateWindow(w){w.element.style.left=w.x+'px';w.element.style.top=w.y+'px';w.element.style.transform=`translate(-50%,-50%) scale(${w.scale})`}
function openMenu(){menuOpen=true;menu.classList.add('visible');statusText.textContent='☝ Mantén el índice sobre una aplicación'}
function closeMenu(){menuOpen=false;menu.classList.remove('visible');statusText.textContent='☝ Apunta con el índice'}
$('#menuButton').onclick=()=>menuOpen?closeMenu():openMenu();
$('#keyboardButton').textContent='🎮 Interacción';$('#keyboardButton').onclick=()=>createWindow('interaccion',innerWidth*.55,innerHeight*.52);
$('#centerButton').onclick=()=>{if(!selectedWindow)return;selectedWindow.x=selectedWindow.targetX=innerWidth/2;selectedWindow.y=selectedWindow.targetY=innerHeight/2;selectedWindow.nx=.5;selectedWindow.ny=.5;updateWindow(selectedWindow);saveWindows()};
$('#clearButton').onclick=()=>{if(confirm('¿Cerrar todas las ventanas del mapa?')){windows.forEach(w=>w.element.remove());windows=[];selectedWindow=null;saveWindows()}};
document.querySelectorAll('.menuItem').forEach(item=>item.onclick=()=>{createWindow(item.dataset.type);closeMenu()});

function buildKeyboard(){
 const rows=[['1','2','3','4','5','6','7','8','9','0'],['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l','ñ'],['⇧','z','x','c','v','b','n','m','⌫'],['123','@','.com','ESPACIO','↵']];
 rows.forEach(chars=>{const row=document.createElement('div');row.className='keyRow';chars.forEach(ch=>{const b=document.createElement('button');b.className='key'+(ch==='ESPACIO'?' space':(['⇧','⌫','123','↵'].includes(ch)?' wide':''));b.textContent=ch;b.dataset.key=ch;row.appendChild(b)});keyboardRows.appendChild(row)});
 keyboardRows.addEventListener('pointerdown',e=>{const b=e.target.closest('.key');if(!b)return;e.preventDefault();pressVirtualKey(b.dataset.key)});
}
let shifted=false;
function pressVirtualKey(k){if(!activeInput){statusText.textContent='Toca primero un campo de texto';return}activeInput.focus();if(k==='⇧'){shifted=!shifted;return}if(k==='⌫'){const s=activeInput.selectionStart??activeInput.value.length,e=activeInput.selectionEnd??s;if(s!==e)activeInput.setRangeText('',s,e,'end');else if(s>0)activeInput.setRangeText('',s-1,s,'end');activeInput.dispatchEvent(new Event('input',{bubbles:true}));return}if(k==='↵'){activeInput.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));if(activeInput.tagName==='TEXTAREA'){activeInput.setRangeText('\n',activeInput.selectionStart,activeInput.selectionEnd,'end')}return}let text=k==='ESPACIO'?' ':k==='123'?'':k;if(shifted){text=text.toUpperCase();shifted=false}const s=activeInput.selectionStart??activeInput.value.length,e=activeInput.selectionEnd??s;activeInput.setRangeText(text,s,e,'end');activeInput.dispatchEvent(new Event('input',{bubbles:true}))}
function toggleKeyboard(force){const show=force===undefined?!keyboard.classList.contains('visible'):force;keyboard.classList.toggle('visible',show);if(show&&activeInput)activeInput.focus()}
$('#hideKeyboard').onclick=()=>toggleKeyboard(false);buildKeyboard();

const handCanvas=document.getElementById('handCanvas');
const handCtx=handCanvas.getContext('2d');
function resizeHandCanvas(){const dpr=Math.min(devicePixelRatio||1,2);handCanvas.width=innerWidth*dpr;handCanvas.height=innerHeight*dpr;handCtx.setTransform(dpr,0,0,dpr,0,0)}
resizeHandCanvas();
const HAND_CONNECTIONS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(hand){
  handCtx.clearRect(0,0,innerWidth,innerHeight);
  if(!hand)return;
  const mirror=activeFacing==='user';
  const pt=p=>({x:(mirror?1-p.x:p.x)*innerWidth,y:p.y*innerHeight});
  const palm=[0,5,9,13,17].map(i=>pt(hand[i]));
  const wrist=pt(hand[0]);
  const index=pt(hand[8]);
  const thumb=pt(hand[4]);
  const pinchDist=Math.hypot(hand[8].x-hand[4].x,hand[8].y-hand[4].y);

  // Palma virtual suave, para que la mano se sienta como un puntero espacial.
  handCtx.save();
  handCtx.beginPath();
  palm.forEach((p,i)=>i?handCtx.lineTo(p.x,p.y):handCtx.moveTo(p.x,p.y));
  handCtx.closePath();
  handCtx.fillStyle='rgba(75,184,255,.10)';
  handCtx.shadowColor='rgba(75,184,255,.35)';
  handCtx.shadowBlur=22;
  handCtx.fill();
  handCtx.restore();

  handCtx.lineWidth=4;
  handCtx.lineCap='round';
  handCtx.lineJoin='round';
  handCtx.strokeStyle='rgba(115,210,255,.82)';
  for(const [a,b] of HAND_CONNECTIONS){
    const A=pt(hand[a]),B=pt(hand[b]);
    handCtx.beginPath();handCtx.moveTo(A.x,A.y);handCtx.lineTo(B.x,B.y);handCtx.stroke();
  }

  hand.forEach((p,i)=>{
    const q=pt(p);handCtx.beginPath();
    handCtx.arc(q.x,q.y,i===8||i===4?7:4,0,Math.PI*2);
    handCtx.fillStyle=(i===8||i===4)?'rgba(255,255,255,.98)':'rgba(85,195,255,.88)';
    handCtx.shadowColor='rgba(70,180,255,.75)';handCtx.shadowBlur=i===8||i===4?12:5;handCtx.fill();
  });

  // Conexión índice-pulgar: se anima cuando el gesto de pellizco está cerca.
  const near=pinchDist<PINCH_OFF;
  handCtx.save();
  handCtx.setLineDash([6,5]);
  handCtx.lineWidth=2;
  handCtx.strokeStyle=near?'rgba(255,255,255,.95)':'rgba(120,205,255,.42)';
  handCtx.beginPath();handCtx.moveTo(index.x,index.y);handCtx.lineTo(thumb.x,thumb.y);handCtx.stroke();
  handCtx.restore();

  if(pinchActive){
    handCtx.beginPath();handCtx.arc((index.x+thumb.x)/2,(index.y+thumb.y)/2,18+Math.sin(performance.now()/90)*3,0,Math.PI*2);
    handCtx.strokeStyle='rgba(255,255,255,.9)';handCtx.lineWidth=3;handCtx.shadowColor='rgba(75,184,255,.95)';handCtx.shadowBlur=22;handCtx.stroke();
  }
}
function indexIsPointing(hand){
 const tip=hand[8],pip=hand[6],mcp=hand[5];
 const indexExtended=(tip.y < pip.y-0.015)||(Math.hypot(tip.x-mcp.x,tip.y-mcp.y)>Math.hypot(pip.x-mcp.x,pip.y-mcp.y)*1.18);
 return indexExtended&&Math.hypot(tip.x-pip.x,tip.y-pip.y)>0.03;
}
function pinchIsActive(hand){
 const d=Math.hypot(hand[8].x-hand[4].x,hand[8].y-hand[4].y);
 if(pinchActive)return d<PINCH_OFF;
 return d<PINCH_ON;
}
function pointInElement(el,x,y){if(!el)return false;const r=el.getBoundingClientRect();return x>=r.left-HIT_HYSTERESIS&&x<=r.right+HIT_HYSTERESIS&&y>=r.top-HIT_HYSTERESIS&&y<=r.bottom+HIT_HYSTERESIS}
function elementAtSpatialPoint(x,y){
 if(menuOpen){for(const item of menu.querySelectorAll('.menuItem')){const r=item.getBoundingClientRect();if(x>=r.left-HIT_HYSTERESIS&&x<=r.right+HIT_HYSTERESIS&&y>=r.top-HIT_HYSTERESIS&&y<=r.bottom+HIT_HYSTERESIS)return item}}
 const candidates=[...document.elementsFromPoint(x,y)].filter(el=>el!==cursor&&el.id!=='interface');
 return candidates.find(el=>el.closest?.('.uiButton,.miniBtn,.windowDot,.browserBar button,input,textarea,.windowHeader,.spatialWindow'))||null;
}
function performSpatialClick(target,x,y){
 if(!target){if(!menuOpen)openMenu();return}
 const clickable=target.closest?.('button,.windowDot,.miniBtn,input,textarea');
 if(clickable){clickable.click?.();if(clickable.matches('input,textarea')){activeInput=clickable;clickable.focus()}return}
 const header=target.closest?.('.windowHeader');if(header){const w=windows.find(v=>v.element===header.closest('.spatialWindow'));if(w)selectWindow(w);return}
 const win=target.closest?.('.spatialWindow');if(win){const w=windows.find(v=>v.element===win);if(w)selectWindow(w)}
}
function updatePinch(x,y,valid,hand){
 if(!valid){pinchActive=false;pinchTarget=null;cursor.classList.remove('dwelling');cursor.style.setProperty('--progress','0deg');return}
 const nextPinch=pinchIsActive(hand);
 const justPinched=nextPinch&&!pinchActive;
 const justReleased=!nextPinch&&pinchActive;
 pinchActive=nextPinch;
 cursor.classList.toggle('dwelling',pinchActive);
 cursor.style.setProperty('--progress',pinchActive?'360deg':'0deg');
 document.querySelectorAll('.menuItem.hovered').forEach(i=>i.classList.remove('hovered'));
 const target=elementAtSpatialPoint(x,y);
 target?.closest?.('.menuItem')?.classList.add('hovered');
 if(justPinched && performance.now()-lastClickAt>350){
   lastClickAt=performance.now();pinchTarget=target;performSpatialClick(target,x,y);
   statusText.textContent='🤏 Pellizco · seleccionado';
 }
 if(justReleased){pinchTarget=null;statusText.textContent='☝ Apunta · 🤏 pellizca para abrir';}
}

const hands=new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.72,minTrackingConfidence:.78});
hands.onResults(results=>{
 const hand=results.multiHandLandmarks?.[0];
 if(!hand){
   handCtx.clearRect(0,0,innerWidth,innerHeight);cursor.classList.remove('active','dwelling');updatePinch(0,0,false,null);statusText.textContent='Busca tu mano...';return
 }
 drawHand(hand);
 const index=hand[8],mirror=activeFacing==='user';
 const rawX=(mirror?1-index.x:index.x)*innerWidth,rawY=index.y*innerHeight;
 const speed=Math.hypot(rawX-smoothX,rawY-smoothY);
 const adaptive=clamp(MOVE_SMOOTH+(speed/innerWidth)*1.8,.20,.48);
 smoothX+=(rawX-smoothX)*adaptive;smoothY+=(rawY-smoothY)*adaptive;
 const x=clamp(smoothX,0,innerWidth),y=clamp(smoothY,0,innerHeight);
 cursor.style.left=x+'px';cursor.style.top=y+'px';cursor.classList.add('active');
 const pointing=indexIsPointing(hand);
 updatePinch(x,y,pointing,hand);
 statusText.textContent=pinchActive?'🤏 Pellizco activo':(pointing?'☝ Índice listo · pellizca':'Extiende el índice');
});

async function startCamera(){
 statusText.textContent='Solicitando cámara...';
 try{
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:false});activeFacing='user'}catch{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});activeFacing='user'}
  camera.srcObject=stream;await camera.play();camera.style.transform=activeFacing==='user'?'scaleX(-1)':'none';cameraDot.classList.add('ready');cameraText.textContent='Cámara activa';
  let busy=false,last=0;const tick=async t=>{if(!busy&&camera.readyState>=2&&t-last>28){busy=true;last=t;try{await hands.send({image:camera})}catch(e){console.warn(e)}busy=false}requestAnimationFrame(tick)};requestAnimationFrame(tick);
 }catch(e){console.error(e);cameraText.textContent='Sin cámara';statusText.textContent='No se pudo acceder a la cámara';statusText.textContent='Puedes usar el mapa con clic o toque aunque no haya cámara';openMenu()}
}

startButton.onclick=async()=>{startScreen.style.display='none';loadWindows();if(!windows.length)openMenu();await startCamera();};
window.addEventListener('resize',()=>{resizeHandCanvas();windows.forEach(w=>{w.x=clamp(w.nx*innerWidth,45,innerWidth-45);w.y=clamp(w.ny*innerHeight,45,innerHeight-45);w.targetX=w.x;w.targetY=w.y;updateWindow(w)});saveWindows()});
window.addEventListener('pagehide',saveWindows);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveWindows()});
</script>
